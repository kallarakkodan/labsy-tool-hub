# Nginx Proxy Manager — "Advanced" tab for the labsy-hub proxy host (PRD §12.5)
#
# This file is not read by any process on the app host. There is no nginx here
# (PRD §12.4) — NPM runs elsewhere (its own container or host) and only the
# text below matters, pasted verbatim into the proxy host's Advanced tab.
# Kept under version control so a re-provision does not require reconstructing
# it from memory.
#
# TLS (certificate issuance, renewal, Force SSL) is configured elsewhere in
# NPM's UI and is not part of this file — see PRD §12.5.
#
# These are an integration contract, not tuning knobs. Uploads and large
# downloads break without them:
#
#   - proxy_request_buffering off is the one most easily missed: without it,
#     NPM writes every 16 MiB chunk to its own container disk before
#     forwarding it, doubling write I/O, filling the container's filesystem
#     during a large upload, and making the client's progress bar meaningless.
#   - proxy_buffering off matters for downloads — with it on, NPM accumulates
#     response data before forwarding, delaying the browser's save dialog and
#     wasting memory on multi-gigabyte files.
#
# Leave "Block Common Exploits" OFF in the proxy host UI: its rule set rejects
# some legitimate paths and there is nothing on a closed LAN to defend against.
# Websockets are not used by this app.

client_max_body_size 32m;        # > CHUNK_SIZE (16 MiB); NPM's default may be lower
proxy_request_buffering off;     # stream upload chunks through; do not spool to disk
proxy_buffering off;             # stream downloads through without buffering
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
send_timeout 3600s;
proxy_set_header X-Forwarded-Proto $scheme;
