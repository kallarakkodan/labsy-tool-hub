services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: labsy-hub:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      # Bind to the LAN interface, or leave as-is and put a reverse proxy in
      # front — same trust model as the systemd deployment (PRD §11.4).
      # Restrict to localhost only (127.0.0.1:3000:3000) if something else on
      # this host will front it.
      - "3000:3000"
    volumes:
      # Named volumes, not bind mounts, so file ownership matches the
      # container's `labsy` user without a host-side chown step. Use bind
      # mounts instead if you specifically want the artifacts on the host
      # filesystem — see DOCKER.md.
      - labsy-storage:/srv/downloads
      - labsy-data:/data
    # Mirrors deploy/labsy-hub.service's MemoryMax=1G (PRD §12.3) — generous
    # against the <300 MB RSS target; do not raise it to paper over a leak.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  labsy-storage:
  labsy-data:
